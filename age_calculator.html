<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  

  <style>
    
body {
  font-family: Arial, sans-serif;
  line-height: 1.6;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: #333;
}

/* Container */
.container {
  background: #fff;
  padding: 20px 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 400px;
  width: 100%;
}

/* Heading */
h1 {
  margin-bottom: 10px;
  font-size: 24px;
  color: #4facfe;
}

/* Paragraph */
p {
  margin-bottom: 20px;
  font-size: 14px;
}

/* Form */
form {
  margin-bottom: 20px;
}

label {
  font-size: 16px;
  display: block;
  margin-bottom: 10px;
}

input[type="date"] {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 20px;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-size: 14px;
}

button {
  background: #4facfe;
  color: #fff;
  padding: 10px 15px;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #00aaff;
}

/* Result Section */
.result {
  font-size: 18px;
  font-weight: bold;
  color: #333;
}

.hidden {
  display: none;
}

  </style>
</head>

<body>
  <div class="container">
    <h1>Age Calculator</h1>
    <p>Age Calculator, transforming your birth date into insightful years.</p>

    <form id="ageForm">
      <label for="birthDate">Enter your birth date:</label>
      <input type="date" id="birthDate" required>
      <button type="submit">Calculate Age</button>
    </form>

    <div id="result" class="result hidden">
      <p>Your age is: <span id="age"></span> years</p>
    </div>
  </div>

  
  <script>
// Select the form and result elements
const form = document.getElementById('ageForm');
const resultDiv = document.getElementById('result');
const ageSpan = document.getElementById('age');

// Add an event listener to handle form submission
form.addEventListener('submit', function (event) {
  event.preventDefault(); // Prevent form submission

  // Get the birth date value from the input
  const birthDateInput = document.getElementById('birthDate').value;
  if (!birthDateInput) {
    alert('Please enter a valid birth date!');
    return;
  }

  // Calculate the age
  const birthDate = new Date(birthDateInput);
  const today = new Date();

  // Calculate years, months, and days
  let years = today.getFullYear() - birthDate.getFullYear();
  let months = today.getMonth() - birthDate.getMonth();
  let days = today.getDate() - birthDate.getDate();

  // Adjust for negative months or days
  if (days < 0) {
    months--;
    const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0); // Last day of previous month
    days += lastMonth.getDate();
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  // Display the age in years, months, and days
  ageSpan.textContent = `${years} years, ${months} months, and ${days} days`;
  resultDiv.classList.remove('hidden');
});


    </script>
</body>
</html>
