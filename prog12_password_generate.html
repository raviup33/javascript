<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>JS-Advance JS - Password Generator</title>
  </head>
  <body>    
    
      <div class="container">
          <h2>Js- Advance JS - Password Generator Solution </h2>

          <h4>Your Password is - </h4>
            <span><p id="pass1"> <span>
              <div id="myDiv">Hello, World!</div>
      </div>

    <script>  

    class Password {
      constructor(){
        console.log("Welcome to Password ");
        this.pass = ""
      }
      generatePassword(len){
        let chars = "abcdefghijklmnopqrstuvwxyz";
        let numbers = "1234567890";
        let specialchar = "!@#$%^&*()_+-={}[]|:;"
        if(len<3){
          console.log("Your Password should be at least 3 character long");
        }
        else{
          let i=0;
          while(i<len){
            this.pass += chars[Math.floor(Math.random() * chars.length)];
            this.pass += numbers[Math.floor(Math.random() * numbers.length)];
            this.pass += specialchar[Math.floor(Math.random() * specialchar.length)];
            i+=3;
          }
          this.pass=this.pass.substr(0, len)
          return this.pass
        }

      }

    }

    let p = new Password()
    console.log(p.generatePassword(2)) // will generate error - Your Password should be at least 3 character long

    let pass1= console.log(p.generatePassword(6)) // Generate Password as per given characters 
    

    // Define a variable
    let pass2= p.generatePassword(10)

    // Get the element by its ID
    let element = document.getElementById("myDiv");

    // Assign the variable value to the element's textContent
    element.textContent = pass2;


    </script>

  </body>
</html>
